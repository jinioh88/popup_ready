services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: popupready-postgres
    environment:
      POSTGRES_DB: popupready
      POSTGRES_USER: popupready
      POSTGRES_PASSWORD: popupready
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: popupready-redis
    ports:
      - "6379:6379"

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: popupready-mqtt
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # WebSocket
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf

volumes:
  postgres-data:
