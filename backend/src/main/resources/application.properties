spring.application.name=backend

# Local infra (infra/docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/popupready
spring.datasource.username=popupready
spring.datasource.password=popupready
spring.data.redis.host=${POPUPREADY_REDIS_HOST:localhost}
# ⚠️ 6380이다. 6379로 되돌리지 말 것 (2026-08-23).
#    이 개발 머신의 6379는 다른 프로젝트(mvno-backoffice-redis)가 잡고 있어서
#    popupready-redis 컨테이너가 조용히 뜨지 못했고(Created 상태로 남는다),
#    localhost:6379 접속이 남의 Redis로 흘러들어갔다. T1-1의 refresh 토큰·패밀리·
#    재사용 감지 상태가 전부 그쪽에 저장되고 있었고, 그쪽이 재시작하거나 FLUSHALL 하면
#    PopupReady 전 세션이 이유 없이 끊긴다. 컨테이너 목록에는 popupready-redis가
#    보이므로 아무도 눈치채지 못하는 종류의 고장이었다.
#    infra/docker-compose.yml이 6380:6379로 매핑한다 — 둘은 함께 움직인다.
spring.data.redis.port=${POPUPREADY_REDIS_PORT:6380}

# 스키마 관리 (2026-08-22 결정, 같은 날 create-drop → update 개정)
# 개발 단계 동안 JPA ddl-auto로 생성한다. Flyway는 의존성만 남기고 비활성.
# 스키마 안정 시점 또는 최초 배포 전에 당시 스키마를 V1__init.sql
# 베이스라인(GIST 인덱스 + enum CHECK 제약 포함)으로 덤프해 복귀한다.
#
# ⚠️ create-drop에서 update로 바꾼 이유 — 하루에 두 번 터진 사고 때문이다.
#    create-drop은 **종료할 때도 스키마를 드롭한다.** bootRun 인스턴스가 둘 겹치면
#    나중 것이 포트 충돌로 죽으면서 먼저 뜬 인스턴스가 쓰던 스키마까지 지운다.
#    살아 있는 서버는 테이블 없는 DB를 보게 되어 스텁 경로는 200, DB 경로만 500이
#    되는 조용한 고장이 남는다. "포트를 먼저 확인한다"는 규칙은 경쟁 조건이라 못 막았다.
#    update는 종료 시 아무것도 하지 않으므로 이 사고가 구조적으로 불가능해진다.
#    덤으로 재시작해도 데이터가 남아 웹·모바일 실서버 검증이 안정된다.
#
#    대가: update는 컬럼 추가만 반영하고 **삭제·타입 축소는 반영하지 않는다.**
#    엔티티에서 필드를 지워도 컬럼은 남는다. 그런 변경이 필요하면 그때 한 번
#    create-drop으로 띄웠다 되돌리거나 수동으로 정리한다.
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false

# 시드는 data.sql이 아니라 Java 시더로 넣는다(T3-3). update에서는 매 기동마다
# data.sql이 다시 실행돼 중복 삽입되기 때문이고, 코드로 넣으면 BCrypt 해시와
# PostGIS 좌표를 하드코딩하지 않아도 된다. 지연 초기화 설정은 그래서 뺐다.

# springdoc — /v3/api-docs 출력이 contracts/openapi.json의 원천이다.
# 키 정렬을 켜야 재생성 시 diff가 실제 스펙 변경만 드러낸다.
springdoc.writer-with-order-by-keys=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JSON API라 뷰 렌더링 구간이 없다. 열어두면 지연 로딩이 컨트롤러 밖에서
# 조용히 쿼리를 날려 N+1이 드러나지 않는다.
spring.jpa.open-in-view=false

# JWT (T2-2). Access 토큰만 쓰며 Refresh는 Sprint 2 범위다.
# ⚠️ secret의 기본값은 로컬 개발 편의용이다. 배포 환경에서는 반드시 환경변수
#    POPUPREADY_JWT_SECRET으로 주입한다 — 이 파일의 값이 그대로 쓰이면
#    저장소를 읽을 수 있는 누구나 토큰을 위조할 수 있다.
# HS256 서명 키는 최소 32바이트여야 한다.
popupready.jwt.secret=${POPUPREADY_JWT_SECRET:local-dev-only-secret-key-please-override-32b}
popupready.jwt.validity=1h

# Refresh 토큰(T1-1). 불투명 난수이며 Redis가 상태의 원천이다.
# ⚠️ refresh-grace는 "회전 직후 옛 토큰을 잠시 후속 토큰의 이정표로 남겨두는 창"이다.
#    0으로 두면 동시 요청이 함께 만료를 맞은 정상 클라이언트가 경합만으로 세션을 잃는다
#    (첫 요청이 회전하는 순간 나머지가 든 토큰이 옛 것이 되기 때문 — 모바일 제기 2026-08-23).
#    창을 넘긴 재사용은 여전히 유출로 보고 패밀리를 끊으므로 감지를 포기한 것은 아니다.
popupready.jwt.refresh-validity=14d
popupready.jwt.refresh-grace=30s

# 개발용 시드(계정 4종·상가 9건·집기 15종). 로컬에서만 켠다.
# ⚠️ 배포 환경에는 이 줄이 없어야 한다 — 켜진 채로 배포되면 알려진 비밀번호로
#    로그인되는 ADMIN 계정이 생긴다. 시더는 이 값이 true일 때만 빈으로 올라온다.
popupready.seed.dev-data=true

# 정산(US-203). 수수료율은 하드코딩하지 않는다 — 요율은 사업 결정이라 코드 배포 없이 바뀔 수 있다.
#
# 10.0%를 공간 대여료·집기 렌털료에만 적용한다. 보증금에는 물리지 않는다 —
# 보증금은 매출이 아니라 반환 대상이고, 수수료를 떼면 브랜드가 돌려받는 돈이 줄어
# 보증금이 아니게 된다(2026-08-23 백엔드 결정, PM 승인).
popupready.settlement.platform-fee-rate=0.100
popupready.settlement.platform-payee-email=admin@popupready.com

# 분산 락(US-201). 값을 설정으로 뺀 이유는 lease가 PG 타임아웃과 함께 움직여야 하기 때문이다.
#
# ⚠️ lease-seconds는 PG read timeout(10s)보다 반드시 커야 한다. 승인 트랜잭션 안에서 외부
#    PG를 부르므로 락 보유 시간이 그만큼 길어지는데, lease가 짧으면 PG 응답을 기다리는 도중
#    락이 자동 해제되어 이중 예약 창이 열린다. DB 왕복 여유까지 더해 30초로 둔다.
popupready.lock.wait-seconds=3
popupready.lock.lease-seconds=30

# PG 호출(US-201). 승인은 멱등하지 않으므로 자동 재시도를 하지 않는다 —
# 타임아웃 후 재호출은 이중 승인 위험이다.
popupready.payment.gateway=mock
popupready.payment.connect-timeout-seconds=3
popupready.payment.read-timeout-seconds=10
