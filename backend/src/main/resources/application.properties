spring.application.name=backend

# Local infra (infra/docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/popupready
spring.datasource.username=popupready
spring.datasource.password=popupready
spring.data.redis.host=localhost
spring.data.redis.port=6379

# 스키마 관리 (2026-08-22 결정) — 개발 단계 동안 JPA ddl-auto로 생성한다.
# Flyway는 의존성만 남기고 비활성. 스키마 안정 시점 또는 최초 배포 전에
# 당시 스키마를 V1__init.sql 베이스라인(GIST 인덱스 포함)으로 덤프해 복귀한다.
# 복귀는 아래 두 줄을 되돌리는 것으로 끝난다. 상세는 backend/CLAUDE.md 참조.
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# create-drop은 매 기동마다 스키마를 새로 만들므로, data.sql 시드가
# 스키마 생성 이후에 실행되도록 지연시켜야 한다.
spring.jpa.defer-datasource-initialization=true

# springdoc — /v3/api-docs 출력이 contracts/openapi.json의 원천이다.
# 키 정렬을 켜야 재생성 시 diff가 실제 스펙 변경만 드러낸다.
springdoc.writer-with-order-by-keys=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JSON API라 뷰 렌더링 구간이 없다. 열어두면 지연 로딩이 컨트롤러 밖에서
# 조용히 쿼리를 날려 N+1이 드러나지 않는다.
spring.jpa.open-in-view=false
